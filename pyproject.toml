[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "iran-cities"
version = "2.0.0"
description = "Complete list of Iranian provinces and cities with geographic coordinates"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
keywords = ["iran", "cities", "provinces", "geography", "coordinates", "persian", "farsi"]
authors = [
  {name = "MrAlfak"}
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "flask>=2.0.0",
  "flask-cors>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/MrAlfak/List-of-provinces-and-cities-of-Iran"
Documentation = "https://github.com/MrAlfak/List-of-provinces-and-cities-of-Iran/blob/main/docs/API.md"
Repository = "https://github.com/MrAlfak/List-of-provinces-and-cities-of-Iran"
"Bug Tracker" = "https://github.com/MrAlfak/List-of-provinces-and-cities-of-Iran/issues"
