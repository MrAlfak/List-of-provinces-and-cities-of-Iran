name: Tests

on:
  push:
    branches: [main, develop, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q api_server.py scripts tests

      - name: Validate current dataset structure
        run: python scripts/validate_data.py

      - name: Run regression tests
        run: python -m pytest tests/

      - name: Audit legacy data debt
        run: python scripts/audit_data.py --json-output data/audit-report.json

      - name: Generate derived formats
        run: python scripts/generate_all.py

      - name: Verify SQL apostrophe escaping regression
        run: |
          grep -F "Sowme''eh Sara" iran_cities.mysql.sql
          grep -F "Sowme''eh Sara" iran_cities.postgresql.sql

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t iran-cities-api:test .
      - name: Smoke-test API image
        run: |
          docker run -d --rm --name iran-cities-api -p 18000:8000 iran-cities-api:test
          for i in $(seq 1 20); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=2).read()"; then
              exit 0
            fi
            sleep 1
          done
          docker logs iran-cities-api
          exit 1

  source-probe:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
    runs-on: ubuntu-latest
    steps:
      - name: Download 1402 source snapshot
        run: curl --fail --location --retry 3 --output /tmp/list.json https://raw.githubusercontent.com/sajaddp/list-of-cities-in-Iran/main/offical/list.json
      - name: Inspect CODEREC=5 semantics
        run: |
          python - <<'PY'
          import json, re, unicodedata
          from collections import Counter, defaultdict

          rows = json.load(open('/tmp/list.json', encoding='utf-8-sig'))
          cities = [r for r in rows if r.get('CODEREC') == 5]

          trans = str.maketrans({'ي':'ی','ى':'ی','ك':'ک','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'})
          def norm(value):
              text = unicodedata.normalize('NFKC', str(value or '')).translate(trans)
              text = text.replace('\u200c',' ').replace('ـ','')
              return re.sub(r'\s+', ' ', text).strip()
          def county_key(r):
              return (norm(r.get('نام استان')), norm(r.get('نام شهرستان')))

          by_county_name = {(county_key(r), norm(r.get('نام'))): r for r in cities}
          suffix_re = re.compile(r'^(.*?)(?:\s|[-–—])(\d+)$')
          suffix_rows = []
          matched = []
          unmatched = []
          for r in cities:
              name = norm(r.get('نام'))
              m = suffix_re.match(name)
              if not m:
                  continue
              suffix_rows.append(r)
              base = m.group(1).strip()
              base_row = by_county_name.get((county_key(r), base))
              item = (name, base, norm(r.get('نام استان')), norm(r.get('نام شهرستان')), r.get('کد دهستان/ شهر'))
              (matched if base_row else unmatched).append(item)

          non_suffix_digit = []
          for r in cities:
              name = norm(r.get('نام'))
              if re.search(r'\d', name) and not suffix_re.match(name):
                  non_suffix_digit.append((name, norm(r.get('نام استان')), norm(r.get('نام شهرستان')), r.get('کد دهستان/ شهر')))

          suspicious_tokens = ('منطقه', 'ناحیه', 'شهرداری', 'حوزه')
          suspicious_named = [
              (norm(r.get('نام')), norm(r.get('نام استان')), norm(r.get('نام شهرستان')))
              for r in cities if any(token in norm(r.get('نام')) for token in suspicious_tokens)
          ]

          exact_duplicates = Counter((county_key(r), norm(r.get('نام'))) for r in cities)
          exact_duplicate_keys = [k for k,v in exact_duplicates.items() if v > 1]

          print('coderec5=', len(cities))
          print('numeric_suffix_rows=', len(suffix_rows))
          print('numeric_suffix_with_base_same_county=', len(matched))
          print('numeric_suffix_without_base_same_county=', len(unmatched))
          print('candidate_independent_city_count=', len(cities) - len(matched))
          print('non_suffix_digit_names=', len(non_suffix_digit))
          print('UNMATCHED_SUFFIX=', json.dumps(unmatched, ensure_ascii=False))
          print('NON_SUFFIX_DIGIT=', json.dumps(non_suffix_digit, ensure_ascii=False))
          print('SUSPICIOUS_TOKENS=', json.dumps(suspicious_named, ensure_ascii=False))
          print('EXACT_DUPLICATE_CITY_KEYS=', len(exact_duplicate_keys))
          print('EXACT_DUPLICATE_EXAMPLES=', json.dumps(exact_duplicate_keys[:50], ensure_ascii=False))

          # The exclusion rule must never delete a numbered row unless its exact
          # unnumbered base is present in the same province+county.
          assert len(matched) <= len(suffix_rows)
          assert len(cities) - len(matched) > 1400
          PY
