name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run uniqueness tests
      run: python tests/test_uniqueness.py
    
    - name: Run coordinates tests
      run: python tests/test_coordinates.py
    
    - name: Generate all formats
      run: python scripts/generate_all.py
    
    - name: Check file sizes
      run: |
        ls -lh iran_cities*.json
        ls -lh iran_cities.sql
        ls -lh iran_cities.csv
        ls -lh iran_cities.geojson
