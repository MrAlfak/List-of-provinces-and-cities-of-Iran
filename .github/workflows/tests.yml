name: Tests

on:
  push:
    branches: [main, develop, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q api_server.py scripts tests

      - name: Validate current dataset structure
        run: python scripts/validate_data.py

      - name: Run regression tests
        run: python -m pytest tests/

      - name: Audit dataset
        run: python scripts/audit_data.py --json-output data/audit-report.json

      - name: Generate derived formats
        run: python scripts/generate_all.py

      - name: Verify SQL apostrophe escaping regression
        run: |
          grep -F "Sowme''eh Sara" iran_cities.mysql.sql
          grep -F "Sowme''eh Sara" iran_cities.postgresql.sql

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t iran-cities-api:test .
      - name: Smoke-test API image
        run: |
          docker run -d --rm --name iran-cities-api -p 18000:8000 iran-cities-api:test
          for i in $(seq 1 20); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=2).read()"; then
              exit 0
            fi
            sleep 1
          done
          docker logs iran-cities-api
          exit 1

  rebuild-1402:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/agent/data-integrity-hardening' &&
      !contains(github.event.head_commit.message, '[data-rebuild]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/data-integrity-hardening
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned SCI 1402 snapshot
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/iran-divisions-1402.json \
            https://raw.githubusercontent.com/sajaddp/list-of-cities-in-Iran/474942269f75ec247e1af5684f5e3eca9f304431/offical/list.json
          curl --fail --location --retry 3 \
            --output LICENSE-DATA-GPL-3.0 \
            https://raw.githubusercontent.com/sajaddp/list-of-cities-in-Iran/474942269f75ec247e1af5684f5e3eca9f304431/LICENSE

      - name: Rebuild canonical city membership
        run: |
          cp iran_cities.json /tmp/legacy-iran-cities.json
          python scripts/rebuild_from_amar_1402.py \
            --source-json /tmp/iran-divisions-1402.json \
            --legacy-json /tmp/legacy-iran-cities.json \
            --output iran_cities.json \
            --provenance data/provenance.json \
            --excluded-report data/excluded-urban-subareas-1402.json

      - name: Validate rebuilt dataset
        run: |
          python scripts/validate_data.py
          python scripts/audit_data.py --strict --json-output data/audit-report.json
          python - <<'PY'
          import json
          data = json.load(open('iran_cities.json', encoding='utf-8'))
          assert len(data) == 31
          assert sum(len(p['cities']) for p in data) == 1450
          assert all(c.get('official_code') for p in data for c in p['cities'])
          print('verified provinces=31 cities=1450 official_codes=complete')
          PY

      - name: Generate source-backed artifacts
        run: python scripts/generate_all.py

      - name: Commit rebuilt data to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            iran_cities.json \
            iran_cities.min.json \
            iran_cities.csv \
            iran_cities.geojson \
            iran_cities.mysql.sql \
            iran_cities.postgresql.sql \
            data/provenance.json \
            data/audit-report.json \
            data/excluded-urban-subareas-1402.json \
            LICENSE-DATA-GPL-3.0
          if git diff --cached --quiet; then
            echo "No rebuilt data changes to commit."
            exit 0
          fi
          git commit -m "Rebuild canonical dataset from SCI 1402 snapshot [data-rebuild]"
          git push origin HEAD:agent/data-integrity-hardening
