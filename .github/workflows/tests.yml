name: Tests

on:
  push:
    branches: [main, develop, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q api_server.py scripts tests

      - name: Validate current dataset structure
        run: python scripts/validate_data.py

      - name: Run regression tests
        run: python -m pytest tests/

      - name: Audit legacy data debt
        run: python scripts/audit_data.py --json-output data/audit-report.json

      - name: Generate derived formats
        run: python scripts/generate_all.py

      - name: Verify SQL apostrophe escaping regression
        run: |
          grep -F "Sowme''eh Sara" iran_cities.mysql.sql
          grep -F "Sowme''eh Sara" iran_cities.postgresql.sql

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t iran-cities-api:test .
      - name: Smoke-test API image
        run: |
          docker run -d --rm --name iran-cities-api -p 18000:8000 iran-cities-api:test
          for i in $(seq 1 20); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=2).read()"; then
              exit 0
            fi
            sleep 1
          done
          docker logs iran-cities-api
          exit 1
