name: Tests

on:
  push:
    branches: [main, develop, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q api_server.py scripts tests

      - name: Validate current dataset structure
        run: python scripts/validate_data.py

      - name: Run regression tests
        run: python -m pytest tests/

      - name: Audit legacy data debt
        run: python scripts/audit_data.py --json-output data/audit-report.json

      - name: Generate derived formats
        run: python scripts/generate_all.py

      - name: Verify SQL apostrophe escaping regression
        run: |
          grep -F "Sowme''eh Sara" iran_cities.mysql.sql
          grep -F "Sowme''eh Sara" iran_cities.postgresql.sql

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t iran-cities-api:test .
      - name: Smoke-test API image
        run: |
          docker run -d --rm --name iran-cities-api -p 18000:8000 iran-cities-api:test
          for i in $(seq 1 20); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/health', timeout=2).read()"; then
              exit 0
            fi
            sleep 1
          done
          docker logs iran-cities-api
          exit 1

  source-probe:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
    runs-on: ubuntu-latest
    steps:
      - name: Download 1402 source snapshot
        run: curl --fail --location --retry 3 --output /tmp/list.json https://raw.githubusercontent.com/sajaddp/list-of-cities-in-Iran/main/offical/list.json
      - name: Inspect CODEREC=5 semantics
        run: |
          python - <<'PY'
          import json, re
          from collections import Counter, defaultdict

          rows = json.load(open('/tmp/list.json', encoding='utf-8-sig'))
          cities = [r for r in rows if r.get('CODEREC') == 5]
          print('rows_total=', len(rows))
          print('coderec5=', len(cities))
          print('diag=', Counter(str(r.get('DIAG')) for r in cities).most_common(30))
          print('faricode_prefix=', Counter(str(r.get('FARICODE'))[:4] for r in cities).most_common(30))
          print('digit_names=', sum(bool(re.search(r'\d|[۰-۹]', str(r.get('نام','')))) for r in cities))

          probes = ['اراک', 'اراک 1', 'اراک 2', 'تهران', 'تهران 1', 'مشهد', 'مشهد 1']
          for name in probes:
              matches = [r for r in cities if str(r.get('نام','')).strip() == name]
              print('PROBE', name, json.dumps(matches[:5], ensure_ascii=False))

          # Print all DIAG/FARICODE combinations for digit-suffixed city names.
          combos = Counter()
          examples = defaultdict(list)
          for r in cities:
              name = str(r.get('نام','')).strip()
              if re.search(r'(?:\s|[-–—])(?:\d+|[۰-۹]+)$', name):
                  key = (str(r.get('DIAG')), str(r.get('FARICODE')))
                  combos[key] += 1
                  if len(examples[key]) < 5:
                      examples[key].append(name)
          print('digit_suffix_combos=', combos.most_common(50))
          for key, count in combos.most_common(20):
              print('COMBO', key, count, examples[key])
          PY
