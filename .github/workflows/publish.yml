name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Validate and test
        run: |
          python scripts/validate_data.py
          python -m pytest tests/
          python scripts/audit_data.py

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

# PyPI publishing was intentionally removed in v2.1.0. The previous project
# metadata did not build a self-contained Python data package/wheel. Re-enable
# PyPI only after the dataset lives inside an importable package and wheel
# installation is covered by CI.
